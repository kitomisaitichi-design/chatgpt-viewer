name: Refresh exact v1.1.2 Windows release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-v1.1.2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-v1.1.2-exact
  cancel-in-progress: false

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message || '', '[release-refresh]')"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the exact uploaded Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          root = Path(".")
          meta = json.loads((root / ".release-meta/v1.1.2-windows-zip.json").read_text(encoding="utf-8"))
          out = Path("/tmp") / meta["file"]

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=meta["compresslevel"]) as z:
              for e in meta["entries"]:
                  prefix = "offline-chat-viewer/"
                  if not e["name"].startswith(prefix):
                      raise SystemExit(f"unexpected package path: {e['name']}")
                  rel = e["name"][len(prefix):]
                  src = root / rel
                  if not src.is_file():
                      raise SystemExit(f"missing package source: {rel}")
                  data = src.read_bytes()

                  zi = zipfile.ZipInfo(e["name"], date_time=tuple(e["dt"]))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.create_system = meta["create_system"]
                  zi.create_version = meta["create_version"]
                  zi.extract_version = meta["extract_version"]
                  zi.flag_bits = meta["flag_bits"]
                  zi.external_attr = e["ext"]
                  z.writestr(
                      zi,
                      data,
                      compress_type=zipfile.ZIP_DEFLATED,
                      compresslevel=meta["compresslevel"],
                  )

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          size = out.stat().st_size
          if digest != meta["sha256"] or size != meta["size"]:
              raise SystemExit(
                  f"exact ZIP reproduction failed: {size} bytes sha256 {digest}; "
                  f"expected {meta['size']} / {meta['sha256']}"
              )
          print(f"Verified exact uploaded archive: {size} bytes, sha256 {digest}")
          PY

      - name: Replace v1.1.2 release asset and release notes
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/Offline-Chat-Viewer-v1.1.2-Windows.zip"
          SHA="01dc00f1b454b8c1cde7991a8baf37532e6dc604eefcd1eb15f4e7c49edf9d0a"

          gh release upload v1.1.2 "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

          cat > /tmp/release-notes.md <<'EOF'
          ## Offline Chat Viewer v1.1.2

          Windows x64 portable release.

          ### What's new
          - Added local archive backups that keep original MD/JSON exports, saved attachments, indexes, organization/settings, and a self-contained archive browser together.
          - Added Google Drive for desktop backup integration with mounted-drive detection, saved custom destinations, and clearer folder controls.
          - Improved Windows backup reliability with retry-safe temporary/progress-file handling.
          - Improved export-folder discovery, modern folder picking, path-copy controls, ZIP-size reporting, and attachment-reference caching.
          - Refined sidebar filtering/ordering, recurring rescan controls, readable-code presentation, and chart interaction behavior retained from the previous reader improvements.

          ### Upgrade
          Close the old viewer console, replace the app files, **keep `.viewer-data`**, and reopen `START-VIEWER.bat`.

          ### Verified Windows package
          The release asset was refreshed from the current uploaded v1.1.2 Windows package. Its 122 packaged files were checked against the repository package source before publication.

          **File:** `Offline-Chat-Viewer-v1.1.2-Windows.zip`  
          **Size:** 14,194,996 bytes  
          **SHA-256:** `01dc00f1b454b8c1cde7991a8baf37532e6dc604eefcd1eb15f4e7c49edf9d0a`
          EOF

          gh release edit v1.1.2             --repo "$GITHUB_REPOSITORY"             --title "Offline Chat Viewer v1.1.2"             --notes-file /tmp/release-notes.md             --latest

      - name: Update README and remove temporary release machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          marker = "## Latest Windows release"
          if marker not in text:
              intro = (
                  "A local ChatGPT-style reader for your Markdown and JSON exports. "
                  "The standard viewer has no package-install step, cloud service, subscription, "
                  "or CDN dependency. Windows x64 Python is included in the download.\n\n"
              )
              section = (
                  "## Latest Windows release\n\n"
                  "- **Download:** [Offline-Chat-Viewer-v1.1.2-Windows.zip]"
                  "(https://github.com/kitomisaitichi-design/chatgpt-viewer/releases/download/"
                  "v1.1.2/Offline-Chat-Viewer-v1.1.2-Windows.zip)\n"
                  "- **Size:** 14,194,996 bytes\n"
                  "- **SHA-256:** `01dc00f1b454b8c1cde7991a8baf37532e6dc604eefcd1eb15f4e7c49edf9d0a`\n\n"
              )
              if intro not in text:
                  raise SystemExit("README intro anchor not found")
              text = text.replace(intro, intro + section, 1)
              p.write_text(text, encoding="utf-8", newline="")
          PY

          rm -f .github/workflows/refresh-v1.1.2.yml
          rm -f .release-meta/v1.1.2-windows-zip.json
          rmdir .release-meta 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[release-refresh] Publish exact v1.1.2 package and docs"
          git push origin HEAD:main
